# Builds the macOS app (Intel + Apple Silicon) on GitHub's Mac runners and
# attaches it to the release. Runs automatically when a release is published,
# or by hand from the Actions tab (enter the release tag, e.g. v1.0.5).
name: Build macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Mac build to (for example v1.0.5)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Use the release's version number
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
