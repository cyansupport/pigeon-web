# Xcode project definition for the iPhone app (generated on CI with XcodeGen).
name: PigeonWeb
options:
  bundleIdPrefix: com.pigeonweb
  deploymentTarget:
    iOS: "16.0"
targets:
  PigeonWeb:
    type: application
    platform: iOS
    sources:
      - PigeonWeb
    settings:
      base:
        PRODUCT_NAME: PigeonWeb
        PRODUCT_BUNDLE_IDENTIFIER: com.pigeonweb.browser
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pigeon Web
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: Websites you allow can use your camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Websites you allow can see your location.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Lets you save images from websites to Photos.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
